name: Weekly card refresh
on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays, early morning US time
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ijson
      - run: python scripts/refresh.py
      - name: Save new data and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dvl-deck refresh"
          git config user.email "actions@users.noreply.github.com"
          git add cards.json combos.json aliases.json; [ -f meta.json ] && git add meta.json || true
          if git diff --cached --quiet; then echo "No changes this week"; exit 0; fi
          git commit -m "Weekly card data refresh"
          git push
          gh workflow run pages.yml --ref main
